services:
  epic-oauth:
    container_name: fgc-epic-oauth
    image: vttc08/free-games-claimer:latest
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      EPIC_AUTH_FILE: /app/data/epic-auth.json
      EPIC_OAUTH_REPORT_FILE: /app/data/epic-free-games-status.json
      EPIC_AUTH_MODE: browser
      EPIC_AUTH_LISTEN_HOST: 0.0.0.0
      EPIC_AUTH_LISTEN_PORT: 3989
      # Set this when accessing the auth page from another machine/browser.
      # EPIC_AUTH_PUBLIC_BASE_URL: http://your-server:3989
      # Optional notifications:
      # NOTIFY: "mailto://user:pass@example.com"
      # NOTIFY_TITLE: "Epic OAuth"
    ports:
      - "3989:3989"
